[package]
name = "sipcall"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone Rust SIP phone - no hosted services, direct peer-to-peer calling"

[[bin]]
name = "sipcall"
path = "src/main.rs"

[dependencies]
rsip = "0.4"
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
cpal = "0.15"
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
